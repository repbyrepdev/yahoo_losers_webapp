name: OpenWiki Update

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 1-5"  # weekday mornings UTC

permissions:
  contents: read  # checkout only reads; the PR step pushes with OPENWIKI_PUSH_TOKEN

# Review hardening (PR #82's Copilot findings):
# - concurrency: two overlapping runs raced on the openwiki/update branch
# - PR step uses OPENWIKI_PUSH_TOKEN (a user OAuth token), NOT GITHUB_TOKEN:
#   PRs opened with GITHUB_TOKEN never trigger the six required checks, so
#   they could never merge under the ruleset
# - openwiki version stays pinned; mermaid+jsdom give authoritative
#   diagram validation
concurrency:
  group: openwiki-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Full history so `openwiki code --update` can diff HEAD against the
          # commit it last documented.
          fetch-depth: 0
          persist-credentials: false  # nothing later may inherit the write token

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install OpenWiki (locked)
        run: |
          npm ci --prefix .github/openwiki-toolchain
          echo "$GITHUB_WORKSPACE/.github/openwiki-toolchain/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Run OpenWiki
        run: openwiki code --update --print
        env:
          OPENWIKI_PROVIDER: copilot
          COPILOT_API_KEY: ${{ secrets.COPILOT_API_KEY }}
          OPENWIKI_MODEL_ID: "gpt-5.5"
          OPENWIKI_TELEMETRY_DISABLED: "1"

      - name: Drop watermark-only churn
        # The gitHead watermark must commit WITH real content changes (or
        # later runs rediff the same history), but a watermark-only diff
        # must not open a PR. Revert it when nothing else changed.
        run: |
          if git status --porcelain -- 'openwiki/**/*.md' 'openwiki/.claims' AGENTS.md CLAUDE.md | grep -q .; then
            echo "content changed; watermark rides along"
          else
            git checkout -- openwiki/.last-update.json 2>/dev/null || true
            echo "watermark-only run; timestamp reverted, no PR"
          fi

      - name: Create OpenWiki update pull request
        id: docs_pr
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          token: ${{ secrets.OPENWIKI_PUSH_TOKEN }}
          add-paths: |
            openwiki
            AGENTS.md
            CLAUDE.md
          branch: openwiki/update
          commit-message: "docs: update OpenWiki"
          title: "docs: update OpenWiki"
          body: |
            Automated OpenWiki documentation update (weekday drift check).

            Zero-touch lane: auto-merge is armed; this PR lands when all
            six required checks are green. Deterministic gates (facts,
            links, lint, secrets, tests) are the reviewers here.

      - name: Arm auto-merge (zero-touch docs lane)
        # Docs-only robot PRs merge themselves once every required check
        # is green. Safety comes from the gates, not eyeballs: the
        # deterministic facts check, strict dead-link build, markdownlint,
        # gitleaks, pytest, and the claims verification that produced the
        # content. Scope is mechanically capped at openwiki/ + the marked
        # guidance blocks.
        if: steps.docs_pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.OPENWIKI_PUSH_TOKEN }}
        run: |
          gh pr merge --auto --squash "${{ steps.docs_pr.outputs.pull-request-number }}" \
            -R "$GITHUB_REPOSITORY"
