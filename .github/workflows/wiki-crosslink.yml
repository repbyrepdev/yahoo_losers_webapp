name: wiki-crosslink
# On PR open: comment which wiki pages document the changed files
# (reverse lookup via openwiki/source-map.md). Deterministic, no LLM.
on:
  pull_request:
    types: [opened]
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: wiki-crosslink-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  crosslink:
    name: crosslink
    # Same-repo PRs only: fork PRs get a read-only token (commenting would
    # fail anyway) and skipping them outright removes any fork-code path.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Comment documented pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/wiki_crosslink.py "${{ github.event.pull_request.number }}"
