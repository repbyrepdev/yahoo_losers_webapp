name: lint
# Unconditional on every PR (no paths filter): these are required checks,
# and a filtered job that never reports blocks the merge forever.
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  ruff:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"  # matches production (.python-version)
      - run: pip install ruff
      - run: ruff check .
  markdownlint:
    name: markdownlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npx --yes markdownlint-cli2 "**/*.md" "!node_modules"
