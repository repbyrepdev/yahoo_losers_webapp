name: gitleaks
# Secret scanning over the full git history on every PR and push to main.
# Catches the committed-credential class (a key pasted into code, a .env
# slipping in). Runtime leak paths are the redaction layer's job
# (provenance.redact_secrets) -- this gate covers what reaches git.
#
# Runs the gitleaks BINARY, version-pinned and checksum-verified against
# the official release manifest -- no marketplace-action dependency.
# Converged with plex_arr_media_stack's gate 2026-08-21: one canonical
# gitleaks pattern across repos. Bump the version and checksum together.
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks (pinned binary, checksum-verified)
        run: |
          curl -sSfL -o /tmp/gl.tgz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gl.tgz" | sha256sum -c -
          tar -xzf /tmp/gl.tgz -C /tmp gitleaks
          /tmp/gitleaks git . --no-banner --redact
