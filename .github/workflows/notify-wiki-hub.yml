name: notify-wiki-hub
# Docs changed on main -> ping the overarching wiki so it rebuilds in
# ~1 minute (its nightly cron is the backstop).
on:
  push:
    branches: [main]
    paths:
      - "openwiki/**"
      - "wiki/**"
      - "docs/**"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "README.md"
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch docs-updated to repbyrep-wiki
        env:
          # Secret enters via env, never via expression interpolation into
          # the script body (no process-args exposure, no injection surface).
          HUB_DISPATCH_TOKEN: ${{ secrets.HUB_DISPATCH_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          curl -sf --connect-timeout 10 --max-time 60 -X POST \
            -H "Authorization: Bearer $HUB_DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/repbyrepdev/repbyrep-wiki/dispatches \
            -d "{\"event_type\": \"docs-updated\", \"client_payload\": {\"repo\": \"$REPO\"}}"
