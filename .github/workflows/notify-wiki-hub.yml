name: notify-wiki-hub
# Docs changed on main -> ping the overarching wiki so it rebuilds in
# ~1 minute (its nightly cron is the backstop).
on:
  push:
    branches: [main]
    paths:
      - "openwiki/**"
      - "wiki/**"
      - "docs/**"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "README.md"
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch docs-updated to repbyrep-wiki
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer ${{ secrets.HUB_DISPATCH_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/repbyrepdev/repbyrep-wiki/dispatches \
            -d '{"event_type": "docs-updated", "client_payload": {"repo": "${{ github.repository }}"}}'
