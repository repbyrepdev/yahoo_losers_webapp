# Auto-scaling Docker Compose Configuration
# This extends the base docker-compose.yml for horizontal scaling

version: '3.8'

services:
  # Scale the app service to multiple instances
  app:
    deploy:
      replicas: 3  # Start with 3 instances
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          memory: 200M
          cpus: '0.5'
        reservations:
          memory: 100M
          cpus: '0.25'

  # Enhanced NGINX with dynamic upstream
  nginx:
    volumes:
      - ./nginx.scale.conf:/etc/nginx/nginx.conf:ro

  # Add a monitoring service for auto-scaling decisions
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: yahoo-losers-cadvisor
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    depends_on:
      - app